name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || xcode-select -p

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project TapGame.xcodeproj \
            -scheme TapGame \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TapGame.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/TapGame.xcarchive/Products/Applications/TapGame.app build/Payload/
          cd build
          zip -r -9 TapGame_unsigned.ipa Payload
          ls -lh TapGame_unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapGame-unsigned-ipa
          path: build/TapGame_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
